version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: tessera-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tessera_db
      MYSQL_USER: tessera_user
      MYSQL_PASSWORD: tessera_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
