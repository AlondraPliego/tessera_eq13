spring.application.name=Eq13Tessera

# --- Datasource ---
# spring.datasource.url=jdbc:mysql://localhost:3306/tessera_db?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/tessera_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=tessera_user
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# El esquema lo controla Flyway, Hibernate solo valida que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
jwt.secret=EstaEsUnaClaveSecretaTemporalParaDesarrolloCambialaEnProduccion123456
jwt.expiration=86400000

# --- Correo (Postfix corriendo en el VPS) ---
# En el VPS, Postfix escucha en localhost:25 y NO pide usuario/contraseña.
# En tu compu local, si no tienes Postfix instalado, el correo no se podrá
# enviar (verás un error en la consola), pero el resto de la app sigue
# funcionando normal.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
mail.remitente=${MAIL_FROM:no-reply@tessera.com}

# --- SMS y WhatsApp (Twilio) ---
# Regístrate gratis en https://www.twilio.com/try-twilio y copia estos 4 datos
# de tu panel. Mientras no los llenes, la app NO manda el SMS/WhatsApp real,
# solo lo deja escrito en la consola (para que puedan seguir probando).
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.sms-from=${TWILIO_SMS_FROM:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# --- Almacenamiento de flyers (imágenes que sube la EMPRESA) ---
# uploadsDir es la carpeta REAL en el disco del VPS. Créala tú mismo la primera
# vez (mkdir -p /home/tessera/uploads) y dale permisos al usuario que corre la app.
app.uploads.dir=${UPLOADS_DIR:/home/tessera/uploads}
# public-path es el prefijo con el que se sirve por HTTP, no lo cambies a
# menos que también cambies el frontend.
app.uploads.public-path=/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Seatmap.pro (mapa interactivo de asientos/zonas) ---
# Estos 3 datos los sacas del panel de administración de seatmap.pro
# (Organization details -> Public API Key / Organization token / Organization ID).
seatmap.base-url=${SEATMAP_BASE_URL:https://booking.seatmap.pro}
seatmap.organization-token=${SEATMAP_ORG_TOKEN:}
seatmap.organization-id=${SEATMAP_ORG_ID:}
# Esta SÍ se le puede dar al frontend (no es secreta, es la "public key")
seatmap.public-key=${SEATMAP_PUBLIC_KEY:}



